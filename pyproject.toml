[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fpga2asic"
version = "0.1.0"
description = "Verification-driven FPGA IP to portable Verilog conversion orchestrator"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
fpga2asic = "fpga2asic.cli:main"
ipverify = "fpga2asic.cli:main"
rtl-manifest = "fpga2asic.extract_cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
